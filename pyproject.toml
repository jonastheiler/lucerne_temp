[project]
name = "lucerne-temp"
version = "0.1.0"
description = "Corrects ECMWF temperature forecasts for Lucerne with MeteoSwiss measurements."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lucerne_temp"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
